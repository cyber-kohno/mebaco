[package]
name = "mebaco-mcp"
version = "0.1.1"
description = "MCP adapter for Mebaco Studio"
edition = "2021"
rust-version = "1.88"
publish = false

[dependencies]
mebaco-mcp-transport = { path = "../../crates/mcp-transport" }
mebaco-mcp-protocol = { path = "../../crates/mcp-protocol" }
anyhow = "1.0"
rmcp = { version = "3.4.0", features = ["server", "macros", "transport-io"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["io-std", "macros", "rt-multi-thread"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading"] }

[build-dependencies]
mebaco-mcp-protocol = { path = "../../crates/mcp-protocol" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
uuid = { version = "1.24", features = ["v4"] }
log = "0.4"
