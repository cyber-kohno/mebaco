<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mebaco Icon Candidates</title>
    <style>
      body {
        margin: 0;
        font-family: Arial, Helvetica, sans-serif;
        background: #f3f3f0;
        color: #1d211f;
      }

      main {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: 24px;
        padding: 32px;
      }

      figure {
        margin: 0;
        padding: 20px;
        background: #ffffff;
        border: 1px solid #ddded8;
      }

      figure.transparent {
        background:
          linear-gradient(45deg, #e7e8e4 25%, transparent 25%),
          linear-gradient(-45deg, #e7e8e4 25%, transparent 25%),
          linear-gradient(45deg, transparent 75%, #e7e8e4 75%),
          linear-gradient(-45deg, transparent 75%, #e7e8e4 75%);
        background-color: #ffffff;
        background-position:
          0 0,
          0 8px,
          8px -8px,
          -8px 0;
        background-size: 16px 16px;
      }

      img {
        display: block;
        width: 128px;
        height: 128px;
        margin: 0 auto 16px;
      }

      figcaption {
        font-size: 14px;
        text-align: center;
      }

      .sizes {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 12px;
        margin-top: 16px;
      }

      .sizes img:nth-child(1) {
        width: 32px;
        height: 32px;
      }

      .sizes img:nth-child(2) {
        width: 24px;
        height: 24px;
      }

      .sizes img:nth-child(3) {
        width: 16px;
        height: 16px;
      }
    </style>
  </head>
  <body>
    <main>
      <figure>
        <img src="./mebaco-icon-01-box-sprout.svg" alt="Candidate 01" />
        <figcaption>01 Box + sprout</figcaption>
        <div class="sizes">
          <img src="./mebaco-icon-01-box-sprout.svg" alt="" />
          <img src="./mebaco-icon-01-box-sprout.svg" alt="" />
          <img src="./mebaco-icon-01-box-sprout.svg" alt="" />
        </div>
      </figure>
      <figure>
        <img src="./mebaco-icon-02-cube-sprout.svg" alt="Candidate 02" />
        <figcaption>02 Cube + sprout</figcaption>
        <div class="sizes">
          <img src="./mebaco-icon-02-cube-sprout.svg" alt="" />
          <img src="./mebaco-icon-02-cube-sprout.svg" alt="" />
          <img src="./mebaco-icon-02-cube-sprout.svg" alt="" />
        </div>
      </figure>
      <figure>
        <img src="./mebaco-icon-03-m-sprout.svg" alt="Candidate 03" />
        <figcaption>03 M + sprout</figcaption>
        <div class="sizes">
          <img src="./mebaco-icon-03-m-sprout.svg" alt="" />
          <img src="./mebaco-icon-03-m-sprout.svg" alt="" />
          <img src="./mebaco-icon-03-m-sprout.svg" alt="" />
        </div>
      </figure>
      <figure>
        <img src="./mebaco-icon-04-seed-tray.svg" alt="Candidate 04" />
        <figcaption>04 Seed tray</figcaption>
        <div class="sizes">
          <img src="./mebaco-icon-04-seed-tray.svg" alt="" />
          <img src="./mebaco-icon-04-seed-tray.svg" alt="" />
          <img src="./mebaco-icon-04-seed-tray.svg" alt="" />
        </div>
      </figure>
      <figure>
        <img src="./mebaco-icon-05-glass-cube-sprout.svg" alt="Candidate 05" />
        <figcaption>05 Glass cube + sprout</figcaption>
        <div class="sizes">
          <img src="./mebaco-icon-05-glass-cube-sprout.svg" alt="" />
          <img src="./mebaco-icon-05-glass-cube-sprout.svg" alt="" />
          <img src="./mebaco-icon-05-glass-cube-sprout.svg" alt="" />
        </div>
      </figure>
      <figure>
        <img src="./mebaco-icon-06-clear-case-sprout.svg" alt="Candidate 06" />
        <figcaption>06 Clear case + sprout</figcaption>
        <div class="sizes">
          <img src="./mebaco-icon-06-clear-case-sprout.svg" alt="" />
          <img src="./mebaco-icon-06-clear-case-sprout.svg" alt="" />
          <img src="./mebaco-icon-06-clear-case-sprout.svg" alt="" />
        </div>
      </figure>
      <figure>
        <img src="./mebaco-icon-07-glass-cube-angled-highlight.svg" alt="Candidate 07" />
        <figcaption>07 Glass cube, angled highlight</figcaption>
        <div class="sizes">
          <img src="./mebaco-icon-07-glass-cube-angled-highlight.svg" alt="" />
          <img src="./mebaco-icon-07-glass-cube-angled-highlight.svg" alt="" />
          <img src="./mebaco-icon-07-glass-cube-angled-highlight.svg" alt="" />
        </div>
      </figure>
      <figure class="transparent">
        <img src="./mebaco-icon-08-transparent-cube-sprout.svg" alt="Candidate 08" />
        <figcaption>08 Transparent glass cube</figcaption>
        <div class="sizes">
          <img src="./mebaco-icon-08-transparent-cube-sprout.svg" alt="" />
          <img src="./mebaco-icon-08-transparent-cube-sprout.svg" alt="" />
          <img src="./mebaco-icon-08-transparent-cube-sprout.svg" alt="" />
        </div>
      </figure>
      <figure class="transparent">
        <img src="./mebaco-icon-09-solid-cube-sprout.svg" alt="Candidate 09" />
        <figcaption>09 Solid taskbar cube</figcaption>
        <div class="sizes">
          <img src="./mebaco-icon-09-solid-cube-sprout.svg" alt="" />
          <img src="./mebaco-icon-09-solid-cube-sprout.svg" alt="" />
          <img src="./mebaco-icon-09-solid-cube-sprout.svg" alt="" />
        </div>
      </figure>
    </main>
  </body>
</html>
