<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mebaco</title>
    <style>
      :root {
        font-family: Arial, Helvetica, sans-serif;
        color: #17343a;
        background: transparent;
        font-synthesis: none;
        text-rendering: optimizeLegibility;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        overflow: hidden;
      }

      body {
        display: grid;
        place-items: center;
        background: linear-gradient(135deg, #f2fbff 0%, #dff7ee 100%);
      }

      main {
        display: grid;
        justify-items: center;
        gap: 12px;
        width: 100%;
        height: 100%;
        padding: 38px 32px 28px;
        border: 1px solid rgba(32, 169, 194, 0.22);
      }

      img {
        width: 88px;
        height: 88px;
      }

      h1 {
        margin: 0;
        color: #123940;
        font-size: 30px;
        font-weight: 700;
        line-height: 1;
      }

      p {
        margin: 0;
        color: rgba(18, 57, 64, 0.68);
        font-size: 13px;
        font-weight: 600;
      }

      .version {
        color: rgba(18, 57, 64, 0.52);
        font-size: 12px;
      }

      .bar {
        position: relative;
        width: 136px;
        height: 4px;
        margin-top: 8px;
        overflow: hidden;
        border-radius: 999px;
        background: rgba(32, 169, 194, 0.18);
      }

      .bar::before {
        content: '';
        position: absolute;
        inset: 0 auto 0 0;
        width: 42%;
        border-radius: inherit;
        background: #20a9c2;
        animation: progress 1.1s ease-in-out infinite;
      }

      @keyframes progress {
        0% {
          transform: translateX(-120%);
        }
        100% {
          transform: translateX(260%);
        }
      }
    </style>
  </head>
  <body>
    <main aria-label="Mebaco startup">
      <img src="/favicon.svg" alt="" />
      <h1>Mebaco</h1>
      <p class="version">version 0.1.0</p>
      <p>Initializing studio...</p>
      <div class="bar" aria-hidden="true"></div>
    </main>
  </body>
</html>
